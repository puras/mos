# agentcli 第 6 站的声明式装配配置（YAML 即装配）：
# seam.SeamRegistry 按名解析组件 → config.AssembleConfig → assistant.New。
# 换驱动只需改 driver 字段（react / plan-execute / reflection / scripted）。

driver: react
model: openai            # seam.KindModel 里的 provider 名（stage6.go 注册了 openai / anthropic）
tools: [builtin]         # builtin = tool/builtin 内置包；自定义工具经 seam.KindTool 注册后按名引用
policy: default          # 缺省策略 = 无额外限制

system_prompt: |
  你是 MoS 学习 CLI 的智能体（由 agentcli.yaml 装配）。
  回答使用与用户相同的语言，简洁、准确；能用工具确认的事实不要凭空猜测。

workspace_root: temp     # 文件工具 jail 根目录
max_turns: 12            # 轮次保险丝（0 不限制）
