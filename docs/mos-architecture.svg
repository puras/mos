<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1320" font-family="-apple-system, 'PingFang SC', 'Helvetica Neue', sans-serif" font-size="13">
  <!-- 背景 -->
  <rect width="1180" height="1320" fill="#fafbfc"/>

  <!-- 标题 -->
  <text x="590" y="36" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">MoS 模块关系图</text>
  <text x="590" y="58" text-anchor="middle" font-size="12" fill="#64748b">由 L1 入口 → L2 Driver 核心 → L3 Driver 实现 → L4 扩展点 → L5 基础设施 → L6 抽象 → L7 工具 → L8 LLM 适配器</text>

  <!-- ========== L1 入口层 ========== -->
  <g>
    <rect x="430" y="80" width="320" height="56" rx="8" fill="#1f6feb" stroke="#0b3b8a" stroke-width="1.5"/>
    <text x="590" y="105" text-anchor="middle" font-weight="700" fill="#fff">assistant.Assistant</text>
    <text x="590" y="124" text-anchor="middle" fill="#dbeafe">一行装配：模型 + 工具 + 策略</text>
    <text x="20" y="112" font-weight="700" fill="#1f6feb">L1 入口</text>
  </g>

  <!-- ========== L2 Driver 核心 ========== -->
  <g>
    <rect x="60" y="180" width="220" height="56" rx="8" fill="#7c3aed" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="170" y="205" text-anchor="middle" font-weight="700" fill="#fff">driver.LoopDriver</text>
    <text x="170" y="224" text-anchor="middle" fill="#e9d5ff">interface</text>

    <rect x="320" y="180" width="260" height="56" rx="8" fill="#7c3aed" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="450" y="205" text-anchor="middle" font-weight="700" fill="#fff">driver.RunContext</text>
    <text x="450" y="224" text-anchor="middle" fill="#e9d5ff">共享上下文</text>

    <rect x="620" y="180" width="220" height="56" rx="8" fill="#7c3aed" stroke="#4c1d95" stroke-width="1.5"/>
    <text x="730" y="205" text-anchor="middle" font-weight="700" fill="#fff">driver.Policy</text>
    <text x="730" y="224" text-anchor="middle" fill="#e9d5ff">安全策略</text>

    <text x="20" y="212" font-weight="700" fill="#7c3aed">L2 核心</text>
  </g>

  <!-- L1 -> L2 -->
  <line x1="590" y1="136" x2="170" y2="180" stroke="#94a3b8" stroke-width="1"/>
  <line x1="590" y1="136" x2="450" y2="180" stroke="#94a3b8" stroke-width="1"/>
  <line x1="590" y1="136" x2="730" y2="180" stroke="#94a3b8" stroke-width="1"/>
  <line x1="820" y1="208" x2="580" y2="208" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="830" y="200" fill="#64748b" font-size="11">注入 GuardBus</text>

  <!-- ========== L3 Driver 实现 + Router ========== -->
  <g>
    <rect x="40"  y="290" width="160" height="56" rx="8" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
    <text x="120" y="315" text-anchor="middle" font-weight="700" fill="#fff">react</text>
    <text x="120" y="333" text-anchor="middle" fill="#fef3c7" font-size="11">ReActDriver 默认</text>

    <rect x="220" y="290" width="160" height="56" rx="8" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
    <text x="300" y="315" text-anchor="middle" font-weight="700" fill="#fff">planexecute</text>
    <text x="300" y="333" text-anchor="middle" fill="#fef3c7" font-size="11">PlanExecuteDriver</text>

    <rect x="400" y="290" width="160" height="56" rx="8" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
    <text x="480" y="315" text-anchor="middle" font-weight="700" fill="#fff">reflection</text>
    <text x="480" y="333" text-anchor="middle" fill="#fef3c7" font-size="11">ReflectionDriver</text>

    <rect x="580" y="290" width="160" height="56" rx="8" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
    <text x="660" y="315" text-anchor="middle" font-weight="700" fill="#fff">scripted</text>
    <text x="660" y="333" text-anchor="middle" fill="#fef3c7" font-size="11">ScriptedDriver (DAG/PTC)</text>

    <rect x="760" y="290" width="200" height="56" rx="8" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
    <text x="860" y="315" text-anchor="middle" font-weight="700" fill="#fff">router.HybridRouter</text>
    <text x="860" y="333" text-anchor="middle" fill="#fef3c7" font-size="11">规则 + LLM 分类兜底</text>

    <text x="20" y="322" font-weight="700" fill="#d97706">L3 Driver</text>
  </g>

  <!-- L3 -> L2 -->
  <line x1="120" y1="290" x2="170" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="300" y1="290" x2="380" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="480" y1="290" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="660" y1="290" x2="510" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="860" y1="290" x2="170" y2="236" stroke="#94a3b8" stroke-width="1"/>

  <!-- L3 内嵌 react -->
  <line x1="300" y1="346" x2="120" y2="346" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="480" y1="346" x2="120" y2="346" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="290" y="362" fill="#64748b" font-size="11">内嵌 executor</text>

  <!-- L3 内部脚本子包 -->
  <rect x="580" y="380" width="160" height="36" rx="6" fill="#fef3c7" stroke="#92400e" stroke-width="1"/>
  <text x="660" y="403" text-anchor="middle" fill="#92400e" font-size="12">dag + validate</text>

  <line x1="660" y1="346" x2="660" y2="380" stroke="#94a3b8" stroke-width="1"/>

  <!-- ========== L4 Agent 框架扩展点 ========== -->
  <g>
    <rect x="40"  y="450" width="220" height="76" rx="8" fill="#059669" stroke="#065f46" stroke-width="1.5"/>
    <text x="150" y="475" text-anchor="middle" font-weight="700" fill="#fff">agent (核心类型)</text>
    <text x="150" y="494" text-anchor="middle" fill="#d1fae5" font-size="11">Auditor · Observer</text>
    <text x="150" y="510" text-anchor="middle" fill="#d1fae5" font-size="11">Compactor · Truncator</text>

    <rect x="290" y="450" width="220" height="76" rx="8" fill="#059669" stroke="#065f46" stroke-width="1.5"/>
    <text x="400" y="475" text-anchor="middle" font-weight="700" fill="#fff">SystemAssembler</text>
    <text x="400" y="494" text-anchor="middle" fill="#d1fae5" font-size="11">槽位式系统提示词</text>
    <text x="400" y="510" text-anchor="middle" fill="#d1fae5" font-size="11">（与 system.go 联动）</text>

    <rect x="540" y="450" width="220" height="76" rx="8" fill="#059669" stroke="#065f46" stroke-width="1.5"/>
    <text x="650" y="475" text-anchor="middle" font-weight="700" fill="#fff">agent/skills.go</text>
    <text x="650" y="494" text-anchor="middle" fill="#d1fae5" font-size="11">SKILL.md 装载/清单注入</text>
    <text x="650" y="510" text-anchor="middle" fill="#d1fae5" font-size="11">懒加载进系统提示词</text>

    <rect x="790" y="450" width="220" height="76" rx="8" fill="#059669" stroke="#065f46" stroke-width="1.5"/>
    <text x="900" y="475" text-anchor="middle" font-weight="700" fill="#fff">activate_skill</text>
    <text x="900" y="494" text-anchor="middle" fill="#d1fae5" font-size="11">模型按需激活</text>
    <text x="900" y="510" text-anchor="middle" fill="#d1fae5" font-size="11">拿正文 + references/</text>

    <text x="20" y="492" font-weight="700" fill="#059669">L4 Agent</text>
  </g>

  <!-- L4 -> L2/L3 -->
  <line x1="150" y1="450" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="400" y1="450" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="650" y1="450" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="900" y1="450" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>

  <!-- ========== L5 基础设施扩展点 ========== -->
  <g>
    <rect x="40"  y="570" width="200" height="56" rx="8" fill="#0ea5e9" stroke="#075985" stroke-width="1.5"/>
    <text x="140" y="595" text-anchor="middle" font-weight="700" fill="#fff">session.Session</text>
    <text x="140" y="614" text-anchor="middle" fill="#e0f2fe" font-size="11">事件日志=唯一事实源</text>

    <rect x="260" y="570" width="160" height="56" rx="8" fill="#0ea5e9" stroke="#075985" stroke-width="1.5"/>
    <text x="340" y="595" text-anchor="middle" font-weight="700" fill="#fff">event.EventBus</text>
    <text x="340" y="614" text-anchor="middle" fill="#e0f2fe" font-size="11">事件投影</text>

    <rect x="440" y="570" width="200" height="56" rx="8" fill="#0ea5e9" stroke="#075985" stroke-width="1.5"/>
    <text x="540" y="595" text-anchor="middle" font-weight="700" fill="#fff">hook.HookBus/GuardBus</text>
    <text x="540" y="614" text-anchor="middle" fill="#e0f2fe" font-size="11">瀑布钩子/单调守卫</text>

    <rect x="660" y="570" width="200" height="56" rx="8" fill="#0ea5e9" stroke="#075985" stroke-width="1.5"/>
    <text x="760" y="595" text-anchor="middle" font-weight="700" fill="#fff">approval/checkpoint</text>
    <text x="760" y="614" text-anchor="middle" fill="#e0f2fe" font-size="11">telemetry/scope</text>

    <rect x="880" y="570" width="140" height="56" rx="8" fill="#0ea5e9" stroke="#075985" stroke-width="1.5"/>
    <text x="950" y="595" text-anchor="middle" font-weight="700" fill="#fff">handle</text>
    <text x="950" y="614" text-anchor="middle" fill="#e0f2fe" font-size="11">execpath · seam</text>

    <text x="20" y="602" font-weight="700" fill="#0ea5e9">L5 基础设施</text>
  </g>

  <!-- L5 -> L2 -->
  <line x1="140" y1="570" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="340" y1="570" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="540" y1="570" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="760" y1="570" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="950" y1="570" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>

  <!-- ========== L6 抽象层 ========== -->
  <g>
    <rect x="40"  y="680" width="220" height="56" rx="8" fill="#db2777" stroke="#9d174d" stroke-width="1.5"/>
    <text x="150" y="705" text-anchor="middle" font-weight="700" fill="#fff">llm.ChatModel</text>
    <text x="150" y="724" text-anchor="middle" fill="#fce7f3" font-size="11">统一模型对象</text>

    <rect x="290" y="680" width="220" height="56" rx="8" fill="#db2777" stroke="#9d174d" stroke-width="1.5"/>
    <text x="400" y="705" text-anchor="middle" font-weight="700" fill="#fff">planner.Planner</text>
    <text x="400" y="724" text-anchor="middle" fill="#fce7f3" font-size="11">ReAct/Plan/Reflect/Script</text>

    <rect x="540" y="680" width="220" height="56" rx="8" fill="#db2777" stroke="#9d174d" stroke-width="1.5"/>
    <text x="650" y="705" text-anchor="middle" font-weight="700" fill="#fff">tool.Tool/Registry</text>
    <text x="650" y="724" text-anchor="middle" fill="#fce7f3" font-size="11">tool.Sandbox</text>

    <rect x="790" y="680" width="220" height="56" rx="8" fill="#db2777" stroke="#9d174d" stroke-width="1.5"/>
    <text x="900" y="705" text-anchor="middle" font-weight="700" fill="#fff">memory.Memory</text>
    <text x="900" y="724" text-anchor="middle" fill="#fce7f3" font-size="11">Retriever (RAG 注入)</text>

    <text x="20" y="712" font-weight="700" fill="#db2777">L6 抽象</text>
  </g>

  <!-- L6 -> L2 -->
  <line x1="150" y1="680" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="400" y1="680" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="650" y1="680" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>
  <line x1="900" y1="680" x2="450" y2="236" stroke="#94a3b8" stroke-width="1"/>

  <!-- L6 planner 依赖 llm -->
  <line x1="400" y1="680" x2="150" y2="680" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ========== L7 工具实现 ========== -->
  <g>
    <rect x="40"  y="800" width="240" height="56" rx="8" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
    <text x="160" y="825" text-anchor="middle" font-weight="700" fill="#fff">tool/builtin</text>
    <text x="160" y="844" text-anchor="middle" fill="#e2e8f0" font-size="11">时间 · 文件 · Shell · WebFetch</text>

    <rect x="320" y="800" width="240" height="56" rx="8" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
    <text x="440" y="825" text-anchor="middle" font-weight="700" fill="#fff">tool/fs</text>
    <text x="440" y="844" text-anchor="middle" fill="#e2e8f0" font-size="11">FS 抽象 · 沙箱 · Roots · jail</text>

    <rect x="600" y="800" width="240" height="56" rx="8" fill="#475569" stroke="#1e293b" stroke-width="1.5"/>
    <text x="720" y="825" text-anchor="middle" font-weight="700" fill="#fff">tool/extension</text>
    <text x="720" y="844" text-anchor="middle" fill="#e2e8f0" font-size="11">扩展工具包</text>

    <text x="20" y="832" font-weight="700" fill="#475569">L7 工具</text>
  </g>

  <!-- L7 -> L6 -->
  <line x1="160" y1="800" x2="650" y2="736" stroke="#94a3b8" stroke-width="1"/>
  <line x1="440" y1="800" x2="650" y2="736" stroke="#94a3b8" stroke-width="1"/>
  <line x1="720" y1="800" x2="650" y2="736" stroke="#94a3b8" stroke-width="1"/>

  <!-- L7 builtin <-> fs -->
  <line x1="280" y1="828" x2="320" y2="828" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- L7 builtin/extension -> L5 event -->
  <line x1="160" y1="800" x2="340" y2="626" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
  <line x1="720" y1="800" x2="340" y2="626" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>

  <!-- ========== L8 LLM 协议适配器 ========== -->
  <g>
    <rect x="60"  y="920" width="200" height="56" rx="8" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
    <text x="160" y="945" text-anchor="middle" font-weight="700" fill="#fff">llm/anthropic</text>
    <text x="160" y="964" text-anchor="middle" fill="#f3f4f6" font-size="11">Claude 原生协议</text>

    <rect x="320" y="920" width="240" height="56" rx="8" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
    <text x="440" y="945" text-anchor="middle" font-weight="700" fill="#fff">llm/openai</text>
    <text x="440" y="964" text-anchor="middle" fill="#f3f4f6" font-size="11">兼容 DeepSeek/GLM/通义/Ollama</text>

    <rect x="620" y="920" width="200" height="56" rx="8" fill="#6b7280" stroke="#374151" stroke-width="1.5"/>
    <text x="720" y="945" text-anchor="middle" font-weight="700" fill="#fff">llm/gemini</text>
    <text x="720" y="964" text-anchor="middle" fill="#f3f4f6" font-size="11">Google Gemini 原生</text>

    <text x="20" y="952" font-weight="700" fill="#6b7280">L8 协议</text>
  </g>

  <!-- L8 implements L6 (虚线 +空心三角) -->
  <line x1="160" y1="920" x2="150" y2="736" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <polygon points="150,736 145,742 155,742" fill="#fafbfc" stroke="#94a3b8"/>
  <line x1="440" y1="920" x2="150" y2="736" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <polygon points="150,736 145,742 155,742" fill="#fafbfc" stroke="#94a3b8"/>
  <line x1="720" y1="920" x2="150" y2="736" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
  <polygon points="150,736 145,742 155,742" fill="#fafbfc" stroke="#94a3b8"/>

  <!-- ========== 图例 ========== -->
  <g>
    <rect x="60" y="1030" width="1060" height="270" rx="8" fill="#fff" stroke="#e2e8f0"/>
    <text x="80" y="1058" font-weight="700" fill="#0f172a">分层身份（图例：色彩随"层"绑定，不随重要度循环）</text>

    <!-- 图例条目 -->
    <g font-size="12">
      <rect x="80"  y="1075" width="22" height="14" fill="#1f6feb" stroke="#0b3b8a"/>
      <text x="112" y="1087" fill="#0f172a">L1 入口 — assistant.Assistant</text>

      <rect x="380" y="1075" width="22" height="14" fill="#7c3aed" stroke="#4c1d95"/>
      <text x="412" y="1087" fill="#0f172a">L2 Driver 核心 — LoopDriver/RunContext/Policy</text>

      <rect x="780" y="1075" width="22" height="14" fill="#d97706" stroke="#92400e"/>
      <text x="812" y="1087" fill="#0f172a">L3 Driver 实现 — react/planexecute/reflection/scripted/router</text>

      <rect x="80"  y="1100" width="22" height="14" fill="#059669" stroke="#065f46"/>
      <text x="112" y="1112" fill="#0f172a">L4 Agent 扩展点 — Auditor/Observer/Skills</text>

      <rect x="380" y="1100" width="22" height="14" fill="#0ea5e9" stroke="#075985"/>
      <text x="412" y="1112" fill="#0f172a">L5 基础设施 — session/event/hook/approval/checkpoint</text>

      <rect x="780" y="1100" width="22" height="14" fill="#db2777" stroke="#9d174d"/>
      <text x="812" y="1112" fill="#0f172a">L6 抽象 — llm/planner/tool/memory 接口</text>

      <rect x="80"  y="1125" width="22" height="14" fill="#475569" stroke="#1e293b"/>
      <text x="112" y="1137" fill="#0f172a">L7 工具 — builtin/fs/extension</text>

      <rect x="380" y="1125" width="22" height="14" fill="#6b7280" stroke="#374151"/>
      <text x="412" y="1137" fill="#0f172a">L8 协议适配 — anthropic/openai/gemini</text>
    </g>

    <text x="80" y="1170" font-weight="700" fill="#0f172a">线型含义</text>
    <line x1="80" y1="1188" x2="120" y2="1188" stroke="#94a3b8" stroke-width="1"/>
    <text x="130" y="1192" fill="#0f172a" font-size="12">实线 — 直接依赖/注入</text>

    <line x1="320" y1="1188" x2="360" y2="1188" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4,3"/>
    <text x="370" y="1192" fill="#0f172a" font-size="12">虚线 — 内嵌/旁路（如 Driver 嵌入 react、单向实现）</text>

    <line x1="80" y1="1210" x2="120" y2="1210" stroke="#94a3b8" stroke-width="1" stroke-dasharray="2,2"/>
    <polygon points="120,1210 115,1206 115,1214" fill="#fafbfc" stroke="#94a3b8"/>
    <text x="130" y="1214" fill="#0f172a" font-size="12">虚线+空心三角 — UML 实现（L8 实现 L6 的接口）</text>

    <text x="80" y="1248" font-weight="700" fill="#0f172a">关键拓扑</text>
    <text x="80" y="1268" fill="#475569" font-size="12">① Assistant 是唯一公开入口；</text>
    <text x="80" y="1284" fill="#475569" font-size="12">② Driver 实现之间存在"内嵌 react"复用（planexecute、reflection 内部都用 react 作为步骤执行器）；</text>
    <text x="80" y="1300" fill="#475569" font-size="12">③ session.Session 是事件日志唯一事实源，所有 Driver/扩展点向其落事件。</text>
  </g>
</svg>